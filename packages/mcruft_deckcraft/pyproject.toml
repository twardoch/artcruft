# this_file: packages/mcruft_deckcraft/pyproject.toml
[project]
license = "Apache-2.0"
name = "mcruft-deckcraft"
dynamic = ["version"]
requires-python = ">=3.12"
dependencies = ["mcruft"]

[project.optional-dependencies]
bundled = ["mcruft-deckcraft-bin"]

[project.entry-points."mcruft.engines"]
deckcraft = "mcruft_deckcraft:engine"

[tool.uv.sources]
mcruft = { workspace = true }

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.version.raw-options]
root = "../.."
