# this_file: packages/mcruft_vectorcraft/pyproject.toml
[project]
license = "Apache-2.0"
name = "mcruft-vectorcraft"
description = "VectorCraft engine for mcruft"
dynamic = ["version"]
requires-python = ">=3.12"
dependencies = ["mcruft", "pypdf"]

[project.optional-dependencies]
bundled = ["mcruft-vectorcraft-bin"]

[project.entry-points."mcruft.engines"]
vectorcraft = "mcruft_vectorcraft:engine"

[tool.uv.sources]
mcruft = { workspace = true }

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.version.raw-options]
root = "../.."

[tool.hatch.build.hooks.vcs]
version-file = "src/mcruft_vectorcraft/__version__.py"

[tool.uv]
# Rebuild editable installs when git state changes, so hatch-vcs metadata stays current.
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]
