# this_file: packages/mcruft_vectorcraft/pyproject.toml
[project]
name = "mcruft-vectorcraft"
dynamic = ["version"]
requires-python = ">=3.12"
dependencies = ["mcruft"]

[project.optional-dependencies]
bundled = ["mcruft-vectorcraft-bin"]

[project.entry-points."mcruft.engines"]
vectorcraft = "mcruft_vectorcraft:engine"

[tool.uv.sources]
mcruft = { workspace = true }

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.version.raw-options]
root = "../.."
