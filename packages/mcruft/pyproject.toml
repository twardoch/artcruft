# this_file: packages/mcruft/pyproject.toml
[project]
license = "Apache-2.0"
name = "mcruft"
dynamic = ["version"]
requires-python = ">=3.12"
dependencies = ["pypdf", "python-pptx", "Pillow"]

[project.optional-dependencies]
mcp = ["mcp"]

[project.entry-points."mcruft.engines"]
lib = "mcruft.engines.lib:engine"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.version.raw-options]
root = "../.."
