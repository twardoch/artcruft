# this_file: packages/mcruft_pdfcraft/pyproject.toml
[project]
license = "Apache-2.0"
name = "mcruft-pdfcraft"
dynamic = ["version"]
requires-python = ">=3.12"
dependencies = ["mcruft", "pypdf"]

[project.optional-dependencies]
bundled = ["mcruft-pdfcraft-bin"]

[project.entry-points."mcruft.engines"]
pdfcraft = "mcruft_pdfcraft:engine"

[tool.uv.sources]
mcruft = { workspace = true }

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.version.raw-options]
root = "../.."
