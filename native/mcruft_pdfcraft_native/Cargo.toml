hayro-interpret = { git = "https://github.com/storytold/pdfcraft", rev = "53199fb4fa36f3c95b539add6218c57aeb2f823c" }
hayro-syntax = { git = "https://github.com/storytold/pdfcraft", rev = "53199fb4fa36f3c95b539add6218c57aeb2f823c" }
hayro-jbig2 = { git = "https://github.com/storytold/pdfcraft", rev = "53199fb4fa36f3c95b539add6218c57aeb2f823c" }
lopdf = { git = "https://github.com/storytold/pdfcraft", rev = "53199fb4fa36f3c95b539add6218c57aeb2f823c" }
